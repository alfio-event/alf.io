{{- /* external links open in a new tab, as they did with Blackfriday's hrefTargetBlank */ -}}
{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $u.IsAbs }} target="_blank" rel="noopener"{{ end -}}
>{{ .Text }}</a>
