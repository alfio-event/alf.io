<div class="modal-body text-center">
    <h4 class="modal-title text-danger text-center"><fa-icon [icon]="['fas', 'exclamation-triangle']" a11yRole="presentation"></fa-icon>{{' '}}{{'reservation-page.cancel-reservation.confirmation.text' | translate}}</h4>
    <hr/>
    <div class="row">
        <div class="col-6">
            <button type="button" class="btn btn-light block-button" (click)="activeModal.close('no')" [disabled]="processing" translate="reservation-page-complete.confirm-cancellation.button.no"></button>
        </div>
        <div class="col-6">
            <button type="button" class="btn btn-danger block-button" (click)="confirm()" [disabled]="processing"><span *ngIf="processing" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>{{ 'reservation-page-complete.confirm-cancellation.button.yes' | translate }}</button>
        </div>
    </div>
</div>
